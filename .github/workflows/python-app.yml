name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 facekit/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 facekit/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test imports
      run: |
        Xvfb :99 -screen 0 1024x768x24 &
        export DISPLAY=:99
        python -c "
        from facekit.pipeline.utils import ProjectUtils
        from facekit.pipeline.sharpness import extract_sharp_frames, get_sharpness_score
        from facekit.pipeline.frames_extract import detect_hardware_acceleration
        from facekit.pipeline.sorter import rank_by_sharpness
        from facekit.pipeline.yolov import _get_model
        print('All pipeline imports OK')
        "
